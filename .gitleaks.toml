# https://github.com/gitleaks/gitleaks
title = "heynbord"

[extend]
useDefault = true

# Example env files are templates only; real secrets live in GitHub Environments.
[[allowlists]]
description = "Example env templates"
paths = ['''(.*?)\\.env\\..*\\.example$''', '''(.*?)\\.env\\.example$''']

# Playwright storage-state fixtures (DummyJSON / local mock JWTs), including
# historical apps/*/e2e/.auth paths no longer in the working tree.
[[allowlists]]
description = "Playwright E2E auth storage-state mocks"
paths = ['''(?i).*e2e/\.auth/.*''', '''(?i).*playwright/\.auth/.*''']

# The ignore file only ever holds fingerprints and the notes explaining them, so
# quoting a flagged line here must not itself become a finding in history.
[[allowlists]]
description = "gitleaks ignore file"
paths = ['''^\.gitleaksignore$''', '''^repos/''']

# A Message Catalog key or a content id (`key: "stages.dungeon-1.enemy"`) is a
# dotted lowercase identifier, not a credential. The generic-api-key rule reads
# the `key:` prefix and the high-entropy value as an API key. These findings sit
# in history, so allowlist the shape for the files that only ever hold ids.
[[allowlists]]
description = "i18n Message Catalog keys and content ids"
condition = "AND"
paths = [
  '''^apps/web/src/.*\.unit\.test\.ts$''',
  '''^scripts/card-back-art/.*\.ts$''',
]
regexTarget = "line"
regexes = ['''\bkey:\s*"[a-z][\w.$-]*"''']

# The Workers skill shows this line as the anti-pattern to avoid, so the value
# is a placeholder. Allowlist that one example; a real key would still fail.
[[allowlists]]
description = "Workers skill API_KEY anti-pattern example"
condition = "AND"
paths = ['''^\.agents/skills/workers-best-practices/.*\.md$''']
regexTarget = "line"
regexes = ['''"API_KEY":\s*"sk-live-abc123\.\.\."''']
