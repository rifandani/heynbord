name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  # The "FORCE_COLOR" variable, when set to 1
  FORCE_COLOR: "1"

jobs:
  sherif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: QuiiBz/sherif@v1
        # with:
        # args: '--ignore-rule root-package-manager-field'

  secrets:
    name: Secret detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # git-subtree squash commits store trees without the `repos/` prefix, so
      # the `.gitleaks.toml` path allowlist cannot cover them. Exclude those
      # commits from the history walk; HEAD paths under `repos/` stay allowlisted.
      - name: Detect secrets
        run: |
          mapfile -t SQUASH < <(git rev-list --grep="^Squashed 'repos/" HEAD)
          if ((${#SQUASH[@]})); then
            gitleaks detect --source . --verbose --redact --exit-code 1 \
              --log-opts="HEAD --not ${SQUASH[*]}"
          else
            gitleaks detect --source . --verbose --redact --exit-code 1
          fi

  # PR-scoped dead code / complexity / duplication / styling gate (new-only).
  # https://docs.fallow.tools/cli/audit · https://docs.fallow.tools/integrations/ci
  fallow:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install deps and disallow changes to lockfile
        run: bun ci

      # CRAP scores need the real per-function coverage of the unit job.
      - name: Download unit coverage report
        uses: actions/download-artifact@v7
        with:
          name: unit-coverage-report
          path: coverage/vitest

      - name: Fallow all checks
        uses: fallow-rs/fallow@v3
        with:
          # command: audit
          # gate: new-only
          dupes-mode: semantic
          coverage: coverage/vitest/coverage-final.json

  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      # ESLint runs via `node` (see node_modules/eslint/bin/eslint.js); default GHA Node is too old for Object.groupBy (ES2024).
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install deps and disallow changes to lockfile
        run: bun ci

      - name: Lint and typecheck
        run: bun lint-typecheck

  # GDD 13: each Stage and each Matchup must be on its win-rate target.
  # The seeds are fixed, so the result changes only when content or rules change.
  # Each mode is its own job: a mode is CPU-bound, and a separate job gives it
  # all 4 cores of the runner. `--parallel` splits the mode over those cores.
  # One job for all modes took about 30 minutes on one core.
  balance:
    name: Balance simulation (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode:
          - stage
          - dungeon
          - floor
          - matchup
          - packs
          - economy
    env:
      # The public ubuntu-latest runner has 4 vCPUs.
      SIM_SHARDS: 4
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install deps and disallow changes to lockfile
        run: bun ci

      - name: Balance simulation
        run: bun rules sim ${{ matrix.mode }} 1000 --check --parallel

  typerange:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install deps and disallow changes to lockfile
        run: bun ci

      - name: Typerange
        run: bun typerange

  # Single gate for the web Vitest project
  unit:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install deps and disallow changes to lockfile
        run: bun ci

      # Vitest loads `apps/web/.env.local` (see `apps/web/vitest.config.ts`).
      # Without this file, modules that read `import.meta.env.VITE_*` at load
      # time fail `APP_CONFIG` validation. Keep the secret in sync with the
      # local `apps/web/.env.local` via `gh secret set WEB_ENV_FILE -e dev`.
      - name: Prepare env file
        env:
          WEB_ENV_FILE: ${{ secrets.WEB_ENV_FILE }}
        run: |
          if [ -n "$WEB_ENV_FILE" ]; then
            echo "$WEB_ENV_FILE" > apps/web/.env.local
          else
            cp apps/web/.env.example apps/web/.env.local
          fi

      - name: Run unit tests with coverage
        run: bun run test:unit:cov

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo '```'
            cat coverage/vitest/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save coverage report as artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-coverage-report
          path: coverage/vitest
          retention-days: 3

  dev-web-build:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install deps and disallow changes to lockfile
        run: bun ci

      - name: Prepare env file
        env:
          WEB_ENV_FILE: ${{ secrets.WEB_ENV_FILE }}
        run: |
          if [ -n "$WEB_ENV_FILE" ]; then
            echo "$WEB_ENV_FILE" > apps/web/.env.local
          else
            cp apps/web/.env.example apps/web/.env.local
          fi

      - name: Build
        run: bun web build
